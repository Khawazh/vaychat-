version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaychat
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vaychat
    ports:
      - "5432:5432"

volumes:
  postgres_data:

