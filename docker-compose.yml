services:
  postgres:
    image: postgres:16-alpine
    container_name: vaychat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: vaychat
      POSTGRES_PASSWORD: vaychat_secret
      POSTGRES_DB: vaychat

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaychat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaychat-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: vaychat-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://vaychat:vaychat_secret@postgres:5432/vaychat?schema=public
      REDIS_URL: redis://redis:6379

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: vaychat-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

