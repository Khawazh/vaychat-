version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaychat
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vaychat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaychat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaychat-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://vaychat:secret@postgres:5432/vaychat?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "VayChatJwtAccessSecret2024VeryLong"
      JWT_REFRESH_SECRET: "VayChatJwtRefreshSecret2024VeryLong"
      CORS_ORIGIN: "*"
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaychat-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://82.147.67.216:4000"
      NEXT_PUBLIC_WS_URL: "http://82.147.67.216:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

